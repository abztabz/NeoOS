name: NeoOS Execution Core

on:
  pull_request:
    paths:
      - "modules/execution-core/**"
      - ".github/workflows/execution-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/execution-core
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7 # v6
        with:
          python-version: "3.11"
      - name: Syntax validation
        run: python -m compileall -q neoos_execution.py tests
      - name: Contract, failure and recovery tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
