name: Knowledge Core

on:
  pull_request:
    paths:
      - "modules/knowledge-core/**"
      - ".github/workflows/knowledge-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/knowledge-core
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modules/knowledge-core/package.json
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-core-package-lock
          path: modules/knowledge-core/package-lock.json
          retention-days: 1
      - name: Test
        run: npm test
