name: Agent Lifecycle

on:
  pull_request:
    paths:
      - "modules/agent-lifecycle/**"
      - ".github/workflows/agent-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/agent-lifecycle
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
      - run: npm test
